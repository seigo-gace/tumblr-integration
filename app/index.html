<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light"><title>TGtumbler | Tumblr操作</title>
<link rel="stylesheet" href="./styles.css"></head>
<body><main class="layout">
<header><div><span class="eyebrow">TGtumbler / Tumblr</span><h1>Tumblr 操作センター</h1><p>専用アカウントの運用とTelegram連携を、ひとつの窓口から。</p><p id="revision" data-commit="__TUMBLR_COMMIT__">revision __TUMBLR_COMMIT__</p></div><div class="connection" id="connection" role="status">外部接続：未設定</div></header>
<nav aria-label="操作分野"><h2>操作分野</h2><div id="modules" class="modules"></div></nav>
<section class="workspace" aria-label="操作チャット">
<div class="workspace-heading"><h2 id="selected-title">操作チャット</h2><p id="selected-description">分野を選んで操作内容を入力してください。</p></div>
<div id="messages" class="messages" role="log" aria-live="polite"><div class="message system">利用できる操作を選択してください。外部アカウント操作・公開は接続と確認が完了するまで実行しません。</div></div>
<form id="chat-form"><label for="instruction">操作指示</label><div class="composer"><textarea id="instruction" rows="2" placeholder="例：投稿の下書きを確認したい" required maxlength="2000"></textarea><button id="send" type="submit">送信</button></div></form>
<div class="footnote">この画面は操作入口です。AI・Tumblr OAuth・公開API・GATE・MPBは接続確認後に有効化します。送信内容を外部へ自動送信しません。</div>
</section></main><script src="./app.js" defer></script></body></html>
