name: Python core checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=. python -m unittest discover -s tests -v
      - run: python -m compileall -q tumblrkit tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app/app.js
      - run: PYTHONPATH=. python -m tumblrkit.appserve build --commit "$GITHUB_SHA" --dest dist
      - uses: actions/upload-artifact@v4
        with:
          name: tumblr-operation-app
          path: dist
          if-no-files-found: error
